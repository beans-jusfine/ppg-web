<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | People Playground</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container[hidden] {
            display: none !important;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #fullscreen-button {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10000;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.85);
            color: white;
            font: 14px Arial, sans-serif;
            cursor: pointer;
        }

    </style>
</head>

<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="unity-container" class="unity-desktop" hidden>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <button id="fullscreen-button" type="button">⛶ Fullscreen</button>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");
        var loadingText = document.querySelector("#loading-text");
        var fullscreenButton = document.querySelector("#fullscreen-button");
        var mergedObjectUrls = [];
        var unityInstance = null;

        fullscreenButton.addEventListener("click", function () {
            if (!unityInstance) return;

            // Use Unity's own fullscreen API so it can resize the WebGL canvas
            // and update its internal fullscreen state together.
            unityInstance.SetFullscreen(document.fullscreenElement ? 0 : 1);
        });

        document.addEventListener("fullscreenchange", function () {
            fullscreenButton.textContent = document.fullscreenElement
                ? "✕ Exit fullscreen"
                : "⛶ Fullscreen";
        });

        function setLoadingText(message) {
            loadingText.textContent = "LOADING... (" + message + ")";
        }

        function releaseMergedUrls() {
            mergedObjectUrls.forEach((url) => URL.revokeObjectURL(url));
            mergedObjectUrls = [];
        }

        function showLoadError(error) {
            console.error("People Playground failed to load:", error);
            loadingText.textContent = "Unable to load the game. Please refresh the page and try again.";
            loadingText.style.color = "red";
            loadingText.style.fontSize = "18px";
            loadingBar.style.display = "none";
            releaseMergedUrls();
        }

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.textContent = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    if (div.parentNode === warningBanner) {
                        warningBanner.removeChild(div);
                    }
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        function mergeFiles(fileParts, label) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        // Blob now owns the merged bytes; release the original chunk references
                        // so they can be reclaimed instead of being kept alongside the full file.
                        buffers.length = 0;
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        mergedObjectUrls.push(mergedFileUrl);
                        resolve(mergedFileUrl);
                        return;
                    }

                    setLoadingText("DOWNLOADING " + label + " PART " + (index + 1) + "/" + fileParts.length);

                    fetch(fileParts[index]).then((response) => {
                        if (!response.ok) {
                            throw new Error("Failed to download " + fileParts[index] + " (HTTP " + response.status + ")");
                        }
                        return response.arrayBuffer();
                    }).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }

                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        setLoadingText("PREPARING GAME FILES");

        Promise.allSettled([
            mergeFiles(getParts("Build/pggbog.wasm", 1, 3), "PPG.WASM"),
            mergeFiles(getParts("Build/pggbog.data", 1, 7), "PPG.DATA")
        ]).then((results) => {
            const failedResult = results.find((result) => result.status === "rejected");
            if (failedResult) {
                throw failedResult.reason;
            }

            const [wasmUrl, dataUrl] = results.map((result) => result.value);
            setLoadingText("STARTING UNITY");
            container.hidden = false;
            var buildUrl = "Build";
            var remoteBuildUrl = "Build";
            var loaderUrl = remoteBuildUrl + "/pggbog.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: remoteBuildUrl + "/pggbog.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Studio Minus",
                productName: "People Playground",
                productVersion: "0",
                matchWebGLToCanvasSize: false,
                webglContextAttributes: { powerPreference: "high-performance" },
                autoSyncPersistentDataPath: true
            };

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                // Render at reduced internal resolution to reduce GPU/CPU
                // compositing workload. Keep the displayed canvas full-size;
                // only its drawing buffer is smaller. Chromebooks get a more
                // aggressive scale since their GPUs are usually much weaker
                // than their screen resolution would suggest.
                var renderScale = 0.8;
                function resizeCanvas() {
                    canvas.width = Math.max(1, Math.round(window.innerWidth * renderScale));
                    canvas.height = Math.max(1, Math.round(window.innerHeight * renderScale));
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                setLoadingText("LOADING GAME 0%");
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                    setLoadingText("LOADING GAME " + Math.round(progress * 100) + "%");
                }).then((instance) => {
                    unityInstance = instance;
                    loadingBar.style.display = "none";
                    loadingText.remove();
                    fullscreenButton.style.display = "block";

                    // Unity has finished loading the merged files, so their Blob URLs
                    // can now be released without affecting the running game.
                    releaseMergedUrls();
                }).catch(showLoadError);
            };
            script.onerror = () => showLoadError(new Error("Unable to load the Unity loader script."));
            document.body.appendChild(script);
        }).catch(showLoadError);
    </script>
</body>

</html>
